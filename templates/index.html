<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>How It Works Kids</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="space-theme">
    <div class="space-toys" aria-hidden="true">
      <span class="toy toy-rocket">&#128640;</span>
      <span class="toy toy-planet">&#128760;</span>
      <span class="toy toy-earth">&#127759;</span>
      <span class="toy toy-star">&#11088;</span>
    </div>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Mission Control for Curious Kids</p>
        <h1>How It Works Kids</h1>
        <p class="subtitle">Launch quick lessons and explore how things work.</p>
      </section>

      <section class="ask-panel" aria-labelledby="ask-heading">
        <h2 id="ask-heading">What would you like to learn?</h2>
        <form action="{{ url_for('animation') }}" method="post" class="question-form">
          <label for="question">Your question</label>
          <input
            id="question"
            name="question"
            type="text"
            placeholder="How does rain happen?"
            autocomplete="off"
            required
          >
          <button type="submit">Make a lesson</button>
          <p class="loading-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="examples" aria-labelledby="examples-heading">
        <h2 id="examples-heading">Try one of these</h2>
        <div class="example-list">
          {% for example in examples %}
            <form action="{{ url_for('animation') }}" method="post" class="question-form">
              <input type="hidden" name="question" value="{{ example }}">
              <button class="example-button" type="submit">{{ example }}</button>
              <p class="loading-message" aria-live="polite"></p>
            </form>
          {% endfor %}
        </div>
      </section>
    </main>

    <script>
      const forms = document.querySelectorAll(".question-form");

      forms.forEach((form) => {
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const message = form.querySelector(".loading-message");
          const button = form.querySelector("button");

          if (button) {
            button.disabled = true;
            button.textContent = "Generating...";
          }

          if (message) {
            message.classList.add("is-visible");
            message.textContent = "Making your lesson...";
          }

          const formData = new FormData(form);
          const body = new URLSearchParams();
          for (const [key, value] of formData.entries()) {
            body.append(key, String(value));
          }
          body.append("autostart", "1");

          try {
            const response = await fetch(form.action, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body
            });
            const html = await response.text();
            document.open();
            document.write(html);
            document.close();
          } catch (error) {
            if (message) {
              message.textContent = "Network issue. Retrying...";
            }
            form.submit();
          }
        });
      });
    </script>
  </body>
</html>
