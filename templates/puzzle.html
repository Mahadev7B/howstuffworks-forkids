<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ puzzle.title }} - How It Works Kids</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="space-theme">
    <div class="space-toys" aria-hidden="true">
      <span class="toy toy-rocket">🚀</span>
      <span class="toy toy-planet">🪐</span>
      <span class="toy toy-earth">🌍</span>
      <span class="toy toy-star">⭐</span>
    </div>
    <main class="page animation-page">
      <section class="result-header">
        <p class="eyebrow">Space Puzzle Mission</p>
        <h1>{{ puzzle.title }}</h1>
        <p class="subtitle">{{ puzzle.prompt }}</p>
      </section>

      <section class="animation-stage">
        <p id="puzzle-status" class="caption">Answer: {{ puzzle.answer }}</p>
        <p id="puzzle-answer" class="end-message is-visible">{{ puzzle.explanation }}</p>
      </section>

      <div class="player-actions">
        <a class="back-button" href="{{ url_for('home') }}">Back to Home</a>
      </div>
    </main>

    <script></script>
  </body>
</html>
